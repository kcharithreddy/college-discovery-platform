# Render Blueprint: creates the API and its PostgreSQL database in one step.
# In Render: New → Blueprint → pick this repository. You will be asked for CLIENT_URL only.
services:
  - type: web
    name: collegefinder-api
    runtime: node
    plan: free
    region: singapore
    branch: main
    buildCommand: npm ci --include=dev && npm run build -w apps/api
    # Apply migrations, load the colleges if the data changed, then start the API.
    startCommand: npm run db:deploy -w apps/api && npm run seed:if-changed -w apps/api && npm start -w apps/api
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: collegefinder-db
          property: connectionString
      - key: CLIENT_URL
        sync: false # your Vercel address, e.g. https://your-site.vercel.app

databases:
  - name: collegefinder-db
    plan: free
    region: singapore
    databaseName: college_discovery
    user: college
