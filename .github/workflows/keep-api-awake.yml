name: Keep API awake

# Render's free plan puts the API to sleep after 15 minutes without visitors,
# so the first visitor waits about a minute. This pings it every 10 minutes.
# Set the repository variable API_URL (Settings → Secrets and variables → Actions → Variables),
# e.g. https://collegefinder-api.onrender.com/api. Without it, this job does nothing.

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    if: ${{ vars.API_URL != '' }}
    steps:
      - name: Ping health check
        env:
          API_URL: ${{ vars.API_URL }}
        run: curl --fail --silent --show-error --retry 3 --retry-delay 20 --max-time 90 "$API_URL/health"
